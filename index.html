<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acesso ao seu material — Palavra e Luz</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:Georgia,'Times New Roman',serif;color:#fff7e6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:30px 18px;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:url('background.jpg') center center / cover no-repeat fixed;}
  body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.84);}
  .cartao{max-width:560px;width:100%;text-align:center;}
  .logo{width:260px;max-width:78%;height:auto;margin:0 auto 24px;display:block;
    filter:drop-shadow(0 0 22px rgba(243,195,78,.35));}
  h1{font-size:30px;line-height:1.2;color:#f3c34e;margin-bottom:14px;}
  p{font-size:18px;line-height:1.55;margin-bottom:10px;}
  .cta{
    display:block;width:100%;max-width:440px;margin:28px auto 0;
    font-family:inherit;font-size:24px;font-weight:bold;text-decoration:none;
    padding:20px 24px;border-radius:14px;
    background:linear-gradient(180deg,#f7d873,#e0a91d);color:#1a1206;
    box-shadow:0 6px 0 #b8911f,0 0 30px rgba(243,195,78,.25);
  }
  .cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b8911f;}
  .nota{font-size:14px;color:#cbbd97;margin-top:24px;line-height:1.6;font-style:italic;}
  .nota a{color:#f3c34e;}
  @media(max-width:600px){h1{font-size:25px;}p{font-size:16px;}.cta{font-size:20px;padding:17px;}}
</style>
</head>
<body>
  <div class="cartao">
    <img src="logo.png" alt="Palavra e Luz" class="logo" onerror="this.style.display='none'">
    <h1>O seu material continua aqui.</h1>
    <p>Se já adquiriu O Manuscrito Sagrado, o seu acesso mantém-se activo nesta página.</p>
    <a class="cta" href="app.html">ENTRAR NO APLICATIVO →</a>
    <p class="nota">
      Dificuldades em aceder? Escreva-nos para
      <a href="mailto:gabriel.luz@noticiasdafe.com.br">gabriel.luz@noticiasdafe.com.br</a>
      e respondemos em até 1 dia útil.
    </p>
  </div>
</body>
</html>
