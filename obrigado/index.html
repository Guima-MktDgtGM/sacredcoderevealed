  .sub { font-size:21px; line-height:1.5; color:#fff7e6; margin-bottom:10px; }
  .sub b { color:#f3c34e; }

  .cta {
    display:block; width:100%; max-width:480px; margin:30px auto 0;
    font-family:inherit; font-size:26px; font-weight:bold; text-decoration:none;
    padding:22px 24px; border-radius:14px;
    background:linear-gradient(180deg,#f7d873,#e0a91d); color:#1a1206;
    box-shadow:0 6px 0 #b8911f, 0 0 30px rgba(243,195,78,.25);
    transition:transform .08s ease;
  }
  .cta:active { transform:translateY(3px); box-shadow:0 2px 0 #b8911f; }

  .note { font-size:15px; color:#cbbd97; margin-top:22px; line-height:1.6; font-style:italic; }
  .note a { color:#f3c34e; }

  @media (max-width:600px){
    h1 { font-size:30px; } .sub { font-size:18px; } .cta { font-size:21px; padding:18px; }
