<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .loading {
            text-align: center;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            margin: 0 5px;
            animation: pulse 1.5s infinite;
        }
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loading">
        <p>Loading...</p>
        <div>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script>
        // Cloaker: Detecta fbclid e redireciona
        (function() {
            // Pega a URL atual
            var url = window.location.href;

            // Verifica se tem fbclid
            if (url.indexOf('fbclid=') !== -1) {
                // TEM fbclid = BLACK (oferta/VSL)
                window.location.href = '/landing-black.html';
            } else {
                // NÃO TEM fbclid = WHITE (informativo)
                window.location.href = '/landing-white.html';
            }
        })();
    </script>
</body>
</html>
